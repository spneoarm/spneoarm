<svg xmlns="http://www.w3.org/2000/svg" width="1506" height="108" viewBox="0 0 1506 108" role="img" aria-label="AI tools: Claude, Codex, Gemini, Grok CLI, and Antigravity CLI">
  <g font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">
